<!doctype html>
<meta charset="utf-8">
<title>AR Remote realistic icons</title>
<style>
body{margin:0;padding:28px;background:#0E1116;color:#E6E9EE;font:13px Inter,Roboto,sans-serif}
main{display:grid;grid-template-columns:repeat(8,130px);gap:26px 18px}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
svg{width:120px;height:120px}
figcaption{text-align:center}
</style>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="blackBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3F47"/><stop offset="0.12" stop-color="#22262C"/><stop offset="1" stop-color="#0B0D10"/>
    </linearGradient>
    <linearGradient id="blackSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16191D"/><stop offset="0.5" stop-color="#262A31"/><stop offset="1" stop-color="#101215"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8C95A1"/><stop offset="0.5" stop-color="#4A515B"/><stop offset="1" stop-color="#2A2F36"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD873" stop-opacity="0.55"/><stop offset="1" stop-color="#FFD873" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B6CF6"/><stop offset="0.45" stop-color="#6A3BE0"/><stop offset="1" stop-color="#E0457B"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/><stop offset="0.51" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cone" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#4A5058"/><stop offset="0.55" stop-color="#1A1D22"/><stop offset="0.85" stop-color="#2C3138"/><stop offset="1" stop-color="#0A0B0D"/>
    </radialGradient>
    <radialGradient id="cap" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#6B727C"/><stop offset="1" stop-color="#15181C"/>
    </radialGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#E9ECF0"/><stop offset="1" stop-color="#C5CBD3"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F4F7"/><stop offset="0.5" stop-color="#B8BEC7"/><stop offset="1" stop-color="#8A919B"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#9FD4FF"/><stop offset="0.35" stop-color="#2A6FD6"/><stop offset="0.8" stop-color="#0B1E45"/><stop offset="1" stop-color="#05070C"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#FFF7D6"/><stop offset="0.45" stop-color="#FFD873"/><stop offset="1" stop-color="#F2A541"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC86B" stop-opacity="0.9"/><stop offset="1" stop-color="#FFC86B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A6B"/><stop offset="0.5" stop-color="#E5392B"/><stop offset="1" stop-color="#A81E14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE48A"/><stop offset="0.5" stop-color="#F5B83A"/><stop offset="1" stop-color="#C8811A"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8955E"/><stop offset="0.5" stop-color="#E0B27C"/><stop offset="1" stop-color="#B07E48"/>
    </linearGradient>
    <linearGradient id="blueDisp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FB8FF"/><stop offset="1" stop-color="#1B6FE0"/>
    </linearGradient>
    <radialGradient id="dial" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C9CFD7"/>
    </radialGradient>
    <linearGradient id="dish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F6F8"/><stop offset="0.6" stop-color="#C3C9D1"/><stop offset="1" stop-color="#8E959F"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E7680"/><stop offset="1" stop-color="#2F343B"/>
    </linearGradient>
    <linearGradient id="vinylLabel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A5B"/><stop offset="1" stop-color="#E5392B"/>
    </linearGradient>
  </defs>
</svg>
<main>

<!-- TV -->

<!-- Floor speaker -->

<!-- Soundbar -->

    <rect x="4" y="50" width="120" height="8" rx="4" fill="#fff" opacity="0.07"/>
  </g>
</svg><figcaption>Soundbar</figcaption></figure>
